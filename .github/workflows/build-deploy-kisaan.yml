name: Build, Deploy and Promote Kisaan.com

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      TARGET_ENV:
        type: choice
        description: 'Target environment (for manual deploy-only)'
        default: 'int'
        required: true
        options:
            - int
            - test
            - acc
            - prod

      DEPLOYMENT_TYPE:
        type: choice
        description: 'Build, deploy, or promote image'
        default: 'build-and-deploy'
        required: true
        options:
            - build
            - deploy
            - build-and-deploy
            - promote-to-test

      ACTION:
        type: choice
        description: 'Additional action to perform'
        default: 'purge-cache'
        required: true
        options:
            - purge-cache
            - none

env:
    DOCKER_REGISTRY: docker.io
    DOCKER_REPO_NAME: bwalia
    TARGET_STACK: nextjs
    IMAGE_NAME: kisaan-nextjs
    SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
    ACTION: ${{ github.event.inputs.ACTION || 'purge-cache' }}

jobs:
  # ==============================================
  # JOB 1: Build Docker image and push with :int tag
  # ==============================================
  build-int:
    name: Build Docker Image (INT)
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Build and Push Docker Image for INT
      id: build
      run: |
        echo "Building kisaan.com Docker image for INT environment..."
        ./devops/docker/docker_build_automation.sh \
          ${{ secrets.DOT_KISAAN_UI_ENV_CREDS_INT }} \
          int \
          ${{ secrets.DOCKER_USERNAME }} \
          ${{ secrets.DOCKER_PASSWD }} \
          ${{ env.DOCKER_REPO_NAME }} \
          ${{ env.DOCKER_REGISTRY }} \
          ${{ env.IMAGE_NAME }} \
          int
        echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO_NAME }}/${{ env.IMAGE_NAME }}:int 2>/dev/null || echo 'none')" >> $GITHUB_OUTPUT
      shell: bash

  # ==============================================
  # JOB 2: Deploy to INT environment
  # ==============================================
  deploy-int:
    name: Deploy to INT
    runs-on: self-hosted
    needs: [build-int]
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Decode and Export Kubeconfig
      env:
        KUBECONFIG_BASE64: ${{ secrets.KUBE_CONFIG_DATA_K3S }}
      run: |
        echo "$KUBECONFIG_BASE64" | base64 -d > kubeconfig
        export KUBECONFIG=$(pwd)/kubeconfig
        echo "Kubeconfig decoded and exported successfully."
      shell: bash
      
    - name: Kubeseal encrypt the env secrets file
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig
        ./devops/kubeseal/kubeseal_automation.sh ${{ secrets.DOT_KISAAN_UI_ENV_CREDS_INT }} "int"
      shell: bash
      
    - name: Check and Install kubectl Binary
      run: |
        if ! command -v kubectl &> /dev/null; then
          echo "kubectl not found. Installing kubectl..."
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
        else
          echo "kubectl is already installed."
        fi
      shell: bash
  
    - name: Check and Install Helm Binary
      run: |
        if ! command -v helm &> /dev/null; then
          echo "Helm not found. Installing Helm..."
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        else
          echo "Helm is already installed."
        fi
      shell: bash

    - name: Deploy kisaan.com to INT using Helm
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig
        echo "Deploying Helm Chart for kisaan.com in INT environment."
        helm list -n int | grep -q "kisaan-int" && helm delete kisaan-int -n int || echo "Release kisaan-int not found, skipping deletion"
        helm upgrade --install kisaan-int \
          -f ./devops/helm-charts/kisaan-chart/values-int.yaml \
          ./devops/helm-charts/kisaan-chart \
          --set image.repository=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO_NAME }}/${{ env.IMAGE_NAME }} \
          --set image.tag=int \
          --namespace int --create-namespace
      shell: bash

    - name: Purge Cloudflare Cache
      if: ${{ env.ACTION == 'purge-cache' }}
      run: |
        curl https://api.cloudflare.com/client/v4/zones/${{ env.ZONE_ID }}/purge_cache \
          -H 'Content-Type: application/json' \
          -H "X-Auth-Email: ${{ env.CLOUDFLARE_EMAIL }}" \
          -H "X-Auth-Key: ${{ env.CLOUDFLARE_API_TOKEN }}" \
          -d '{"purge_everything": true}'

    - name: Slack Notification - INT Deployed
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: general
        SLACK_COLOR: ${{ job.status }}
        SLACK_ICON: https://github.com/rtCamp.png?size=48
        SLACK_MESSAGE: 'kisaan.com deployed to https://int.kisaan.com/ (INT) :rocket:'
        SLACK_TITLE: kisaan.com INT deployment status
        SLACK_USERNAME: rtCamp
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ==============================================
  # JOB 3: Promote image to TEST (re-tag, no rebuild)
  # ==============================================
  promote-to-test:
    name: Promote Image to TEST
    runs-on: ubuntu-latest
    needs: [deploy-int]
    steps:
    - name: Login to Docker Registry
      run: |
        echo "${{ secrets.DOCKER_PASSWD }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      shell: bash

    - name: Promote INT image to TEST (re-tag)
      run: |
        echo "Promoting INT image to TEST by re-tagging..."
        docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO_NAME }}/${{ env.IMAGE_NAME }}:int
        docker tag ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO_NAME }}/${{ env.IMAGE_NAME }}:int \
                   ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO_NAME }}/${{ env.IMAGE_NAME }}:test
        docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO_NAME }}/${{ env.IMAGE_NAME }}:test
        echo "Image successfully promoted to TEST tag!"
      shell: bash

  # ==============================================
  # JOB 4: Deploy to TEST environment
  # ==============================================
  deploy-test:
    name: Deploy to TEST
    runs-on: self-hosted
    needs: [promote-to-test]
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Decode and Export Kubeconfig
      env:
        KUBECONFIG_BASE64: ${{ secrets.KUBE_CONFIG_DATA_K3S }}
      run: |
        echo "$KUBECONFIG_BASE64" | base64 -d > kubeconfig
        export KUBECONFIG=$(pwd)/kubeconfig
        echo "Kubeconfig decoded and exported successfully."
      shell: bash
      
    - name: Kubeseal encrypt the env secrets file
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig
        ./devops/kubeseal/kubeseal_automation.sh ${{ secrets.DOT_KISAAN_UI_ENV_CREDS_TEST }} "test"
      shell: bash
      
    - name: Check and Install kubectl Binary
      run: |
        if ! command -v kubectl &> /dev/null; then
          echo "kubectl not found. Installing kubectl..."
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
        else
          echo "kubectl is already installed."
        fi
      shell: bash
  
    - name: Check and Install Helm Binary
      run: |
        if ! command -v helm &> /dev/null; then
          echo "Helm not found. Installing Helm..."
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        else
          echo "Helm is already installed."
        fi
      shell: bash

    - name: Deploy kisaan.com to TEST using Helm
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig
        echo "Deploying Helm Chart for kisaan.com in TEST environment."
        helm list -n test | grep -q "kisaan-test" && helm delete kisaan-test -n test || echo "Release kisaan-test not found, skipping deletion"
        helm upgrade --install kisaan-test \
          -f ./devops/helm-charts/kisaan-chart/values-test.yaml \
          ./devops/helm-charts/kisaan-chart \
          --set image.repository=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO_NAME }}/${{ env.IMAGE_NAME }} \
          --set image.tag=test \
          --namespace test --create-namespace
      shell: bash

    - name: Purge Cloudflare Cache
      if: ${{ env.ACTION == 'purge-cache' }}
      run: |
        curl https://api.cloudflare.com/client/v4/zones/${{ env.ZONE_ID }}/purge_cache \
          -H 'Content-Type: application/json' \
          -H "X-Auth-Email: ${{ env.CLOUDFLARE_EMAIL }}" \
          -H "X-Auth-Key: ${{ env.CLOUDFLARE_API_TOKEN }}" \
          -d '{"purge_everything": true}'

    - name: Slack Notification - TEST Deployed
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: general
        SLACK_COLOR: ${{ job.status }}
        SLACK_ICON: https://github.com/rtCamp.png?size=48
        SLACK_MESSAGE: 'kisaan.com promoted and deployed to https://test.kisaan.com/ (TEST) :rocket:'
        SLACK_TITLE: kisaan.com TEST deployment status
        SLACK_USERNAME: rtCamp
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
